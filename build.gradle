// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Top-level build file where you can add configuration options common to all sub-projects/modules.
project.ext.buildToolsVersion = '28.0.2'
project.ext.minSdkVersion = 14
project.ext.sdkVersion = 28
project.ext.supportLibraryVersion = '28.0.0'
project.ext.supportLibraryVersionPrefix = '28.0.0'
project.ext.supportLibraryVersionSuffix = ''
project.ext.fixLibraryVersion = '0'

project.ext.extrasLibraryVersionSuffix = ''
buildscript {
    ext {
        setup = [
                compileSdk: 34,
                buildTools: '28.0.3',
                minSdk    : 19,
                targetSdk : 34
        ]
        versions = [
                supportLib: '28.0.0',
                multidexLib: '1.0.3',
                requeryLib: '1.6.0',
                sqliteAndroidLib: '3.23.1',
                rxJavaLib: '2.2.2',
                rxAndroidLib: '2.1.0',
                iconicsLib: '3.0.4@aar',
                materialDesignTypeface: '2.2.0.4@aar',
                fontawesomeTypeface: '5.0.13.0@aar',
                communityMaterialTypeface: '2.0.46.1@aar',
                materializeLib: '1.1.2@aar',
                fastAdapterLib: '3.2.6@aar',
                materialDrawerLib: '6.0.7@aar',
                streamLib: '1.2.0',
                timeLib: '1.1.0',
                acraLib: '5.1.3',
                gendalfLib: '1.3.1',
                preferenceCompatLib: '28.0.0.0',
                filepickerLib: '4.2.1',
                permissionsDispatcherLib: '3.2.0',
                rxBinding2Lib: '2.2.0',
                mpAndroidChartLib: 'v3.0.3'
        ]
    }
    repositories {
        google()  // Move google() to the top
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.1'  // Change to 3.2.1
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$KOTLIN_VERSION"
    }
}

allprojects {
    repositories {
        google()  // Move google() to the top
        mavenCentral()
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
